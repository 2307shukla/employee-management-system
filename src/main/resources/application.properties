spring.application.name=employee-management-system
server.port=${PORT:8081}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:emsdb}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=true
# Fail fast and loudly if the datasource is unreachable, instead of hanging
# silently with no log output until the platform's own deploy timeout kills
# the process. Render's "port scan timeout" gave zero information about
# whether this was the actual cause; this makes it unambiguous next time.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
# Defers bean creation until first use instead of building the whole
# context eagerly at startup (Security filter chain, OpenAPI scanning,
# JPA repositories, etc.) - reduces cold-start time on constrained CPU.
spring.main.lazy-initialization=true
# Signing key for login tokens (at least 32 characters). Set JWT_SECRET; there is no default on purpose.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
springdoc.swagger-ui.path=/swagger-ui.html
